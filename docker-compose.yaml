services:
  frontend:
    build: ./webui/frontend
    environment:
      - NEXT_PUBLIC_SERVER_ADDRESS=${HOST_IP}:2000
      - NEXT_PUBLIC_BACKEND_SERVER_ADDRESS=${HOST_IP}:5000
    ports: 
      - "3000:3000"
    networks:
      - my-network
    depends_on:
      - stream-server
      - processing

  stream-server:
    build: ./webui/stream-server
    ports:
      - "2000:2000"
    networks:
      - my-network

  processing:
    build: ./webui/backend
    ports:
      - "5000:5000"
    networks:
      - my-network
    depends_on:
      llama:
        condition: service_healthy
        

  llama:
    build: ./app
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 20s
      timeout: 20s
      retries: 10
      start_period: 30s
    networks:
      - my-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  my-network:
    external: false
    ipam:
      config:
        - subnet: 172.16.238.0/24
          gateway: 172.16.238.1